<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Playlist Lectures Viewer</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="branding">Developed by Aryan</div>
  </header>

  <!-- PAGE WRAPPER (SIDEBAR + MAIN CONTENT) -->
  <div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h3>Saved Playlists</h3>
      <ul id="savedList"></ul>
    </aside>

    <!-- MAIN SECTION -->
    <main class="main-content">
      <h1 class="page-title">YouTube Playlist Lectures</h1>

      <div class="form-card">
        <input id="playlistInput" placeholder="Paste playlist link..." />

        <div class="btn-row">
          <button id="loadBtn" class="btn-main">Load Lectures</button>
          <button id="saveBtn" class="btn-secondary">Save Playlist</button>
        </div>

        <div id="status"></div>
      </div>

      <div id="results"></div>
    </main>

  </div>

  <script src="index.js"></script>
</body>
</html>
